name: Build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  WEB_PROJECT: src/Djohnnie.SoftwareFactory.Web/Djohnnie.SoftwareFactory.Web.csproj
  SYNC_PROJECT: src/Djohnnie.SoftwareFactory.Sync/Djohnnie.SoftwareFactory.Sync.csproj
  SYNC_FUNCTION_APP: softwarefactory-sync
  DATA_PROJECT: src/Djohnnie.SoftwareFactory.DataAccess.Sql
  TEST_PROJECT: tests/Djohnnie.SoftwareFactory.Web.Tests/Djohnnie.SoftwareFactory.Web.Tests.csproj
  # The EF design-time factory requires a connection string; build-time EF commands never connect to it.
  PLACEHOLDER_CONNECTION: Server=localhost;Database=Placeholder;TrustServerCertificate=True

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      # A throwaway SQL Server for the tests that need real SQL Server behavior (SqlServerDatabase in the tests).
      # The password only exists inside this job's container.
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Dghsf-Tests-2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Dghsf-Tests-2026!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet restore Djohnnie.SoftwareFactory.slnx
          dotnet tool restore

      - name: Build
        # Warnings fail the build in CI (locally they stay warnings, so work in progress still builds).
        run: dotnet build Djohnnie.SoftwareFactory.slnx --configuration Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Test
        env:
          DGHSF_TEST_SQL_SERVER: Server=localhost,1433;User ID=sa;Password=Dghsf-Tests-2026!;TrustServerCertificate=True
        run: dotnet test ${{ env.TEST_PROJECT }} --configuration Release --no-build

      - name: Check for missing migrations
        env:
          ConnectionStrings__Database: ${{ env.PLACEHOLDER_CONNECTION }}
        run: dotnet ef migrations has-pending-model-changes --project ${{ env.DATA_PROJECT }} --configuration Release --no-build

      - name: Publish web app
        run: dotnet publish ${{ env.WEB_PROJECT }} --configuration Release --no-build --output ${{ runner.temp }}/web

      - name: Publish sync function app
        run: dotnet publish ${{ env.SYNC_PROJECT }} --configuration Release --no-build --output ${{ runner.temp }}/sync

      - name: Create migrations bundle
        env:
          ConnectionStrings__Database: ${{ env.PLACEHOLDER_CONNECTION }}
        run: |
          dotnet restore ${{ env.DATA_PROJECT }} --runtime linux-x64
          dotnet ef migrations bundle \
            --project ${{ env.DATA_PROJECT }} \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained \
            --output ${{ runner.temp }}/migrations/efbundle \
            --force

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: ${{ runner.temp }}/web
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: sync
          path: ${{ runner.temp }}/sync
          if-no-files-found: error
          # The Functions worker needs the .azurefunctions folder, which is left out by default.
          include-hidden-files: true

      - uses: actions/upload-artifact@v4
        with:
          name: migrations
          path: ${{ runner.temp }}/migrations
          if-no-files-found: error

  deploy:
    name: Migrate database and deploy web and function apps
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      FIREWALL_RULE: github-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: migrations
          path: migrations

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web

      - uses: actions/download-artifact@v4
        with:
          name: sync
          path: sync

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Open SQL firewall for this runner
        run: |
          ip=$(curl -fsS https://api.ipify.org)
          echo "Allowing runner IP $ip"
          az sql server firewall-rule create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --server "${{ vars.AZURE_SQL_SERVER_NAME }}" \
            --name "$FIREWALL_RULE" \
            --start-ip-address "$ip" --end-ip-address "$ip" \
            --output none

      - name: Run database migrations
        env:
          AZURE_SQL_CONNECTION_STRING: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
        run: |
          chmod +x migrations/efbundle
          ConnectionStrings__Database="$AZURE_SQL_CONNECTION_STRING" ./migrations/efbundle --connection "$AZURE_SQL_CONNECTION_STRING"

      - name: Close SQL firewall
        if: always()
        run: |
          az sql server firewall-rule delete \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --server "${{ vars.AZURE_SQL_SERVER_NAME }}" \
            --name "$FIREWALL_RULE" \
            --output none || true

      - name: Deploy web app
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: web

      - name: Deploy sync function app
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.SYNC_FUNCTION_APP }}
          package: sync
          sku: flexconsumption
