<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#444"/></marker>
  </defs>
  <rect width="800" height="340" fill="#fafafa"/>
  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold">Work item hierarchy</text>

  <rect x="300" y="50" width="200" height="44" rx="8" fill="#f3e8fd" stroke="#7b4fa5"/>
  <text x="400" y="78" text-anchor="middle">Epic  (label: epic)</text>
  <rect x="300" y="135" width="200" height="44" rx="8" fill="#e8f0fe" stroke="#4a6fa5"/>
  <text x="400" y="163" text-anchor="middle">Feature  (label: feature)</text>
  <rect x="300" y="220" width="200" height="44" rx="8" fill="#e6f4ea" stroke="#3d8b57"/>
  <text x="400" y="248" text-anchor="middle">Story  (label: story)</text>

  <rect x="570" y="135" width="200" height="44" rx="8" fill="#fde8e8" stroke="#b04a4a"/>
  <text x="670" y="163" text-anchor="middle">Bug  (label: bug)</text>
  <rect x="570" y="220" width="200" height="44" rx="8" fill="#fff4e0" stroke="#c98a1b"/>
  <text x="670" y="248" text-anchor="middle">Feature request</text>

  <g stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M400,94 L400,135"/>
    <path d="M400,179 L400,220"/>
  </g>
  <text x="408" y="119" font-size="11" fill="#444">contains</text>
  <text x="408" y="204" font-size="11" fill="#444">contains</text>

  <text x="670" y="295" text-anchor="middle" font-size="12" fill="#444">standalone, optionally linked</text>
  <text x="30" y="325" font-size="12" fill="#444">On GitHub the hierarchy is expressed with labels and “Part of #123” links in the issue body.</text>
</svg>
