<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#444"/></marker>
  </defs>
  <rect width="900" height="260" fill="#fafafa"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold">Work item lifecycle</text>

  <rect x="20" y="70" width="140" height="56" rx="8" fill="#eee" stroke="#888"/>
  <text x="90" y="103" text-anchor="middle">Draft</text>
  <rect x="215" y="70" width="170" height="56" rx="8" fill="#e8f0fe" stroke="#4a6fa5"/>
  <text x="300" y="94" text-anchor="middle">Accepted</text>
  <text x="300" y="112" text-anchor="middle" font-size="11">GitHub issue created</text>
  <rect x="440" y="70" width="170" height="56" rx="8" fill="#fff4e0" stroke="#c98a1b"/>
  <text x="525" y="94" text-anchor="middle">In progress</text>
  <text x="525" y="112" text-anchor="middle" font-size="11">agent assigned</text>
  <rect x="665" y="70" width="200" height="56" rx="8" fill="#e6f4ea" stroke="#3d8b57"/>
  <text x="765" y="94" text-anchor="middle">Done</text>
  <text x="765" y="112" text-anchor="middle" font-size="11">issue closed / PR merged</text>

  <g stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M160,98 L215,98"/>
    <path d="M385,98 L440,98"/>
    <path d="M610,98 L665,98"/>
  </g>
  <text x="188" y="62" text-anchor="middle" font-size="11">I accept</text>
  <text x="412" y="62" text-anchor="middle" font-size="11">assign</text>
  <text x="638" y="62" text-anchor="middle" font-size="11">sync</text>

  <rect x="215" y="170" width="395" height="50" rx="8" fill="#fde8e8" stroke="#b04a4a"/>
  <text x="412" y="193" text-anchor="middle">Edit after acceptance → new linked “diff” issue</text>
  <text x="412" y="210" text-anchor="middle" font-size="11">original issue stays unchanged</text>
  <g stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)" stroke-dasharray="5,4">
    <path d="M300,126 L300,170"/>
  </g>
</svg>
